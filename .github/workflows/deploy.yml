name: Build & Deploy

on:
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ynsinan/gram-kumbaram-backend:latest
            ghcr.io/ynsinan/gram-kumbaram-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Ynsinan/gram-kumbaram-backend
